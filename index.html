<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trao Tay — Chợ đồ cũ & sang nhượng</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --success: #059669;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header-inner {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .container {
      max-width: 1040px;
      margin: 18px auto;
      padding: 0 16px 48px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 8px 13px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #f9fafb; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger {
      background: #fef2f2;
      border-color: #fecaca;
      color: var(--danger);
    }
    .btn-success {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: var(--success);
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #eff6ff;
      color: var(--primary);
    }
    .badge-admin {
      background: #fef3c7;
      color: #92400e;
    }
    .badge-sold {
      background: #fee2e2;
      color: #991b1b;
    }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 16px;
    }
    @media (max-width: 640px) {
      .toolbar { grid-template-columns: 1fr; }
    }
    input, select, textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      color: var(--text);
    }
    textarea { min-height: 76px; resize: vertical; }
    .field { margin-bottom: 11px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 14px;
    }
    .item-img {
      width: 100%;
      height: 185px;
      object-fit: cover;
      border-radius: 9px;
      background: #e5e7eb;
      margin-bottom: 10px;
    }
    .price {
      font-size: 17px;
      font-weight: 800;
      color: var(--primary);
      margin: 4px 0;
    }
    .meta {
      font-size: 12.5px;
      color: var(--muted);
    }
    .item-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      max-height: 92vh;
      overflow-y: auto;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      background: #f9fafb;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .err-box {
      color: var(--danger);
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="#">Trao Tay</a>
      <div class="nav-actions" id="navActions">
        <button class="btn btn-primary" id="btnOpenPost">+ Đăng tin</button>
        <button class="btn" id="btnOpenAuth">Đăng nhập / Đăng ký</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="card toolbar">
      <input id="searchInput" type="search" placeholder="Tìm theo tên món đồ, danh mục, người bán..." />
      <select id="categoryFilter">
        <option value="">Tất cả danh mục</option>
        <option value="Điện tử - Linh kiện">Điện tử - Linh kiện</option>
        <option value="Sách - Học tập">Sách - Học tập</option>
        <option value="Gia dụng - Đời sống">Gia dụng - Đời sống</option>
        <option value="Khác">Khác</option>
      </select>
    </div>

    <div class="grid" id="itemsGrid">
      <div class="card meta">Đang tải danh sách tin đăng...</div>
    </div>
  </main>

  <!-- Modal Đăng nhập / Đăng ký / Quên mật khẩu -->
  <div class="modal-backdrop" id="authModal">
    <div class="modal">
      <div class="modal-head">
        <strong>Tài khoản Trao Tay</strong>
        <button class="btn" id="btnCloseAuth" type="button">✕</button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tabLogin" type="button">Đăng nhập</button>
        <button class="tab-btn" id="tabRegister" type="button">Đăng ký</button>
      </div>

      <div class="err-box" id="authErr"></div>

      <form id="authForm">
        <div id="registerFields" style="display:none;">
          <div class="field">
            <label for="aName">Tên hiển thị</label>
            <input id="aName" type="text" maxlength="30" placeholder="Ví dụ: Duy Lê" />
          </div>
          <div class="field">
            <label for="aPhone">Số điện thoại</label>
            <input id="aPhone" type="tel" maxlength="20" placeholder="Ví dụ: 0912345678" />
          </div>
        </div>

        <div class="field">
          <label for="aEmail">Gmail</label>
          <input id="aEmail" type="email" required placeholder="tenban@gmail.com" />
        </div>

        <div class="field">
          <label for="aPassword">Mật khẩu (tối thiểu 8 ký tự)</label>
          <input id="aPassword" type="password" required minlength="8" placeholder="••••••••" />
        </div>

        <button class="btn btn-primary" id="btnSubmitAuth" type="submit" style="width:100%;">
          Đăng nhập
        </button>
      </form>

      <button type="button" id="btnOpenForgot"
              style="background:none; border:none; color:#2563eb; text-decoration:underline; cursor:pointer; padding:0; margin-top:10px; font-size:13px;">
        Quên mật khẩu?
      </button>

      <div id="forgotWrap" style="display:none; margin-top:12px; padding-top:12px; border-top:1px solid #e5e7eb;">
        <div style="font-size:13px; font-weight:700; margin-bottom:6px;">Khôi phục mật khẩu qua Gmail</div>
        <input id="fpEmail" type="email" placeholder="Nhập Gmail đã đăng ký..." style="margin-bottom:8px;" />
        <div style="display:flex; gap:8px;">
          <button id="btnSendReset" type="button" class="btn btn-primary">Gửi link đặt lại</button>
          <button id="btnCancelReset" type="button" class="btn">Hủy</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Đăng tin mới -->
  <div class="modal-backdrop" id="postModal">
    <div class="modal">
      <div class="modal-head">
        <strong>Đăng tin Trao Tay</strong>
        <button class="btn" id="btnClosePost" type="button">✕</button>
      </div>

      <div class="err-box" id="postErr"></div>

      <form id="postForm">
        <div class="field">
          <label for="pTitle">Tên món đồ</label>
          <input id="pTitle" type="text" required maxlength="100" placeholder="Ví dụ: Mạch STM32F103C8T6" />
        </div>
        <div class="field">
          <label for="pCategory">Danh mục</label>
          <select id="pCategory">
            <option value="Điện tử - Linh kiện">Điện tử - Linh kiện</option>
            <option value="Sách - Học tập">Sách - Học tập</option>
            <option value="Gia dụng - Đời sống">Gia dụng - Đời sống</option>
            <option value="Khác">Khác</option>
          </select>
        </div>
        <div class="field">
          <label for="pPrice">Giá (VNĐ — nhập 0 nếu tặng)</label>
          <input id="pPrice" type="number" min="0" step="1000" value="0" required />
        </div>
        <div class="field">
          <label for="pDesc">Mô tả tình trạng</label>
          <textarea id="pDesc" maxlength="600" placeholder="Tình trạng hoạt động, phụ kiện kèm theo, khu vực giao dịch..."></textarea>
        </div>
        <div class="field">
          <label for="pImage">Ảnh món đồ (tùy chọn, tự nén JPG)</label>
          <input id="pImage" type="file" accept="image/*" />
        </div>
        <button class="btn btn-primary" id="btnSubmitPost" type="submit" style="width:100%;">
          Đăng tin
        </button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://enazqmppsnazycsrvutd.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_QjN1z2ZHccsBbrgnWINklg_nca4uWGU";
  </script>
  <script>
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentProfile = null;
    let profilesMap = new Map();
    let allItems = [];
    let authMode = "login";

    const viMsg = m => {
      m = String(m || "");
      if (/already registered/i.test(m)) return "Email này đã được đăng ký.";
      if (/DUP_NAME|tt_profiles_name_unique/i.test(m)) return "Tên hiển thị này đã có người sử dụng.";
      if (/DUP_PHONE|tt_profiles_phone_unique/i.test(m)) return "Số điện thoại này đã được đăng ký cho tài khoản khác.";
      if (/invalid login/i.test(m)) return "Sai email hoặc mật khẩu.";
      if (/not confirmed/i.test(m)) return "Email chưa được xác nhận. Hãy kiểm tra hộp thư.";
      if (/rate limit|too many/i.test(m)) return "Thao tác quá nhanh, hãy thử lại sau ít phút.";
      if (/password/i.test(m)) return "Mật khẩu không đạt yêu cầu (tối thiểu 8 ký tự).";
      return m;
    };

    const escapeHtml = s => String(s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));

    const formatPrice = n => Number(n || 0) === 0
      ? "Tặng miễn phí"
      : Number(n).toLocaleString("vi-VN") + " đ";

    function showErr(el, msg) {
      el.textContent = msg;
      el.style.display = "block";
    }
    function clearErr(el) {
      el.textContent = "";
      el.style.display = "none";
    }

    function renderHeader() {
      const nav = document.getElementById("navActions");
      if (!currentUser) {
        nav.innerHTML = `
          <button class="btn btn-primary" id="btnOpenPost">+ Đăng tin</button>
          <button class="btn" id="btnOpenAuth">Đăng nhập / Đăng ký</button>
        `;
      } else {
        const name = escapeHtml(currentProfile?.name || currentUser.email);
        const isAdmin = currentProfile?.role === "admin";
        nav.innerHTML = `
          <span class="badge ${isAdmin ? "badge-admin" : ""}">${name}${isAdmin ? " • Admin" : ""}</span>
          <button class="btn btn-primary" id="btnOpenPost">+ Đăng tin</button>
          <button class="btn" id="btnLogout">Đăng xuất</button>
        `;
        document.getElementById("btnLogout")?.addEventListener("click", async () => {
          await sb.auth.signOut();
        });
      }
      document.getElementById("btnOpenPost")?.addEventListener("click", openPostModal);
      document.getElementById("btnOpenAuth")?.addEventListener("click", () => openAuthModal("login"));
    }

    async function loadSessionAndProfile() {
      const { data } = await sb.auth.getSession();
      currentUser = data.session?.user || null;
      currentProfile = null;
      if (currentUser) {
        const { data: prof } = await sb
          .from("tt_profiles")
          .select("*")
          .eq("id", currentUser.id)
          .maybeSingle();
        currentProfile = prof || null;
      }
      renderHeader();
    }

    async function loadData() {
      const [{ data: profs }, { data: items, error }] = await Promise.all([
        sb.from("tt_profiles").select("id, name, phone, role"),
        sb.from("tt_items").select("*").order("created_at", { ascending: false })
      ]);

      profilesMap = new Map((profs || []).map(p => [p.id, p]));
      if (error) {
        document.getElementById("itemsGrid").innerHTML =
          `<div class="card meta">Không tải được tin đăng: ${escapeHtml(error.message)}</div>`;
        return;
      }
      allItems = items || [];
      renderItems();
    }

    function renderItems() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const cat = document.getElementById("categoryFilter").value;
      const grid = document.getElementById("itemsGrid");

      const filtered = allItems.filter(it => {
        if (cat && it.category !== cat) return false;
        if (!q) return true;
        const seller = profilesMap.get(it.user_id);
        const hay = `${it.title} ${it.category} ${it.description} ${seller?.name || ""}`.toLowerCase();
        return hay.includes(q);
      });

      if (!filtered.length) {
        grid.innerHTML = `<div class="card meta">Chưa có tin đăng nào phù hợp.</div>`;
        return;
      }

      const isAdmin = currentProfile?.role === "admin";
      grid.innerHTML = filtered.map(it => {
        const seller = profilesMap.get(it.user_id) || {};
        const canManage = currentUser && (currentUser.id === it.user_id || isAdmin);
        const imgHtml = it.image_url
          ? `<img class="item-img" src="${escapeHtml(it.image_url)}" alt="${escapeHtml(it.title)}" loading="lazy" />`
          : `<div class="item-img" style="display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:13px;">Không có ảnh</div>`;

        return `
          <article class="card">
            ${imgHtml}
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
              <span class="badge">${escapeHtml(it.category)}</span>
              ${it.status === "sold" ? `<span class="badge badge-sold">Đã giao</span>` : ""}
            </div>
            <h3 style="margin:8px 0 2px;font-size:16px;">${escapeHtml(it.title)}</h3>
            <div class="price">${formatPrice(it.price)}</div>
            <p style="margin:6px 0 10px;font-size:13.5px;color:#374151;">${escapeHtml(it.description)}</p>
            <div class="meta">Người đăng: <strong>${escapeHtml(seller.name || "Thành viên")}</strong>${seller.phone ? ` • SĐT: ${escapeHtml(seller.phone)}` : ""}</div>
            ${canManage ? `
              <div class="item-actions">
                <button class="btn btn-success" onclick="toggleSold('${it.id}', '${it.status}')">
                  ${it.status === "sold" ? "Mở lại tin" : "Đánh dấu đã giao"}
                </button>
                <button class="btn btn-danger" onclick="deleteItem('${it.id}')">Xóa</button>
              </div>
            ` : ""}
          </article>
        `;
      }).join("");
    }

    window.toggleSold = async (id, curStatus) => {
      const next = curStatus === "sold" ? "available" : "sold";
      const { error } = await sb.from("tt_items").update({ status: next }).eq("id", id);
      if (error) return alert("Lỗi cập nhật: " + viMsg(error.message));
      await loadData();
    };

    window.deleteItem = async (id) => {
      if (!confirm("Xóa tin đăng này?")) return;
      const { error } = await sb.from("tt_items").delete().eq("id", id);
      if (error) return alert("Lỗi xóa tin: " + viMsg(error.message));
      await loadData();
    };

    const authModal = document.getElementById("authModal");
    const authErr = document.getElementById("authErr");

    function openAuthModal(mode = "login") {
      authMode = mode;
      clearErr(authErr);
      document.getElementById("tabLogin").classList.toggle("active", mode === "login");
      document.getElementById("tabRegister").classList.toggle("active", mode === "register");
      document.getElementById("registerFields").style.display = mode === "register" ? "block" : "none";
      document.getElementById("btnSubmitAuth").textContent = mode === "login" ? "Đăng nhập" : "Tạo tài khoản";
      authModal.classList.add("open");
    }

    document.getElementById("btnCloseAuth").addEventListener("click", () => authModal.classList.remove("open"));
    document.getElementById("tabLogin").addEventListener("click", () => openAuthModal("login"));
    document.getElementById("tabRegister").addEventListener("click", () => openAuthModal("register"));

    document.getElementById("authForm").addEventListener("submit", async e => {
      e.preventDefault();
      clearErr(authErr);
      const email = document.getElementById("aEmail").value.trim().toLowerCase();
      const password = document.getElementById("aPassword").value;
      const btn = document.getElementById("btnSubmitAuth");
      btn.disabled = true;

      try {
        if (authMode === "login") {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
        } else {
          const name = document.getElementById("aName").value.trim();
          const phone = document.getElementById("aPhone").value.trim();
          if (!name) throw new Error("Vui lòng nhập Tên hiển thị.");
          if (!phone) throw new Error("Vui lòng nhập Số điện thoại.");

          const { error } = await sb.auth.signUp({
            email,
            password,
            options: { data: { name, phone } }
          });
          if (error) throw error;
        }
        authModal.classList.remove("open");
        document.getElementById("authForm").reset();
      } catch (err) {
        showErr(authErr, viMsg(err.message));
      } finally {
        btn.disabled = false;
      }
    });

    const forgotWrap = document.getElementById("forgotWrap");
    const fpEmail = document.getElementById("fpEmail");
    document.getElementById("btnOpenForgot").addEventListener("click", () => {
      forgotWrap.style.display = "block";
      const curEmail = document.getElementById("aEmail").value.trim();
      if (curEmail) fpEmail.value = curEmail;
      fpEmail.focus();
    });
    document.getElementById("btnCancelReset").addEventListener("click", () => {
      forgotWrap.style.display = "none";
    });
    document.getElementById("btnSendReset").addEventListener("click", async () => {
      clearErr(authErr);
      const email = fpEmail.value.trim().toLowerCase();
      if (!email) return showErr(authErr, "Vui lòng nhập Gmail đã đăng ký.");

      const btn = document.getElementById("btnSendReset");
      btn.disabled = true;
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + window.location.pathname
      });
      btn.disabled = false;

      if (error) return showErr(authErr, viMsg(error.message));
      alert("Nếu Gmail này đã đăng ký, hệ thống đã gửi link đặt lại mật khẩu. Hãy kiểm tra hộp thư (cả Spam).");
      forgotWrap.style.display = "none";
    });

    async function compressImage(file, maxW = 1024, quality = 0.78) {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, maxW / bmp.width);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(bmp.width * scale);
      canvas.height = Math.round(bmp.height * scale);
      const ctx = canvas.getContext("2d");
      ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
      return new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", quality));
    }

    const postModal = document.getElementById("postModal");
    const postErr = document.getElementById("postErr");

    function openPostModal() {
      if (!currentUser) {
        openAuthModal("login");
        return;
      }
      clearErr(postErr);
      postModal.classList.add("open");
    }

    document.getElementById("btnClosePost").addEventListener("click", () => postModal.classList.remove("open"));

    document.getElementById("postForm").addEventListener("submit", async e => {
      e.preventDefault();
      clearErr(postErr);
      if (!currentUser) return openAuthModal("login");

      const title = document.getElementById("pTitle").value.trim();
      const category = document.getElementById("pCategory").value;
      const price = Number(document.getElementById("pPrice").value || 0);
      const description = document.getElementById("pDesc").value.trim();
      const file = document.getElementById("pImage").files[0];
      const btn = document.getElementById("btnSubmitPost");
      btn.disabled = true;

      try {
        let imageUrl = "";
        if (file) {
          const blob = await compressImage(file);
          const path = `${currentUser.id}/${crypto.randomUUID()}.jpg`;
          const { error: upErr } = await sb.storage
            .from("tt-images")
            .upload(path, blob, { contentType: "image/jpeg", upsert: false });
          if (upErr) throw upErr;
          const { data: pub } = sb.storage.from("tt-images").getPublicUrl(path);
          imageUrl = pub.publicUrl;
        }

        const { error: insErr } = await sb.from("tt_items").insert({
          user_id: currentUser.id,
          title,
          category,
          price,
          description,
          image_url: imageUrl
        });
        if (insErr) throw insErr;

        postModal.classList.remove("open");
        document.getElementById("postForm").reset();
        await loadData();
      } catch (err) {
        showErr(postErr, viMsg(err.message));
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById("searchInput").addEventListener("input", renderItems);
    document.getElementById("categoryFilter").addEventListener("change", renderItems);

    sb.auth.onAuthStateChange(async (event) => {
      if (event === "PASSWORD_RECOVERY") {
        const newPass = prompt("Nhập mật khẩu mới (tối thiểu 8 ký tự):");
        if (!newPass || newPass.length < 8) {
          alert("Mật khẩu mới cần ít nhất 8 ký tự.");
          return;
        }
        const { error } = await sb.auth.updateUser({ password: newPass });
        alert(error ? "Đổi mật khẩu thất bại: " + viMsg(error.message) : "Đổi mật khẩu thành công!");
      }
      await loadSessionAndProfile();
      await loadData();
    });

    (async () => {
      await loadSessionAndProfile();
      await loadData();
    })();
  </script>
</body>
</html>
