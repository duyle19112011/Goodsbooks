<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mua bán, cho tặng & trao đổi đồ cũ</title>
  <link rel="icon" type="image/jpeg" href="./logo-phuoc-vinh.jpg" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #131b2e;
      --panel-2: #1a243d;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.18);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container { max-width: 1040px; margin: 0 auto; padding: 16px; }
    header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px 0 20px; border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
    .brand-logo {
      width: 34px; height: 34px; border-radius: 50%;
      object-fit: cover; background: #fff; flex-shrink: 0;
    }
    .nav-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .badge-user {
      padding: 6px 10px; border-radius: 999px; background: var(--panel-2);
      border: 1px solid var(--border); font-size: 13px; color: #cbd5e1;
    }
    button, select, input, textarea {
      font: inherit; color: var(--text); background: var(--panel-2);
      border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px;
    }
    button { cursor: pointer; font-weight: 600; transition: 0.15s ease; }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--primary); border-color: transparent; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-amber { background: rgba(245, 158, 11, 0.18); border-color: rgba(245, 158, 11, 0.45); color: #fcd34d; }
    .btn-ghost { background: transparent; }
    .btn-success { background: rgba(16, 185, 129, 0.16); border-color: rgba(16, 185, 129, 0.4); color: #6ee7b7; }
    .btn-danger { background: rgba(239, 68, 68, 0.16); border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }
    .hero { padding: 24px 0 14px; }
    .hero h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 34px); }
    .hero p { margin: 0; color: var(--muted); }
    .toolbar {
      display: grid; grid-template-columns: 1fr auto; gap: 10px; margin: 18px 0 20px;
    }
    @media (max-width: 600px) { .toolbar { grid-template-columns: 1fr; } }
    .staff-panel {
      display: none; margin-bottom: 20px; padding: 14px; border-radius: 14px;
      background: var(--panel); border: 1px solid var(--border);
    }
    .staff-panel.show { display: block; }
    .user-row {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; padding: 10px 12px; border-radius: 10px;
      background: var(--panel-2); border: 1px solid var(--border);
    }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(295px, 1fr)); gap: 16px;
    }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; display: flex; flex-direction: column;
    }
    .card.pinned { border-color: rgba(245, 158, 11, 0.55); }
    .card.notice { border-color: rgba(99, 102, 241, 0.5); }
    .card.sold { opacity: 0.72; }
    .thumb {
      width: 100%; height: 180px; object-fit: cover; background: var(--panel-2);
      display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px;
    }
    .card-body { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill-pin {
      display: inline-block; width: fit-content; font-size: 12px; padding: 2px 8px;
      border-radius: 999px; background: rgba(245, 158, 11, 0.2); color: #fcd34d; font-weight: 600;
    }
    .pill-notice {
      display: inline-block; width: fit-content; font-size: 12px; padding: 2px 8px;
      border-radius: 999px; background: rgba(99, 102, 241, 0.22); color: #c7d2fe; font-weight: 600;
    }
    .status-pill {
      display: inline-block; width: fit-content; font-size: 12px; padding: 2px 8px;
      border-radius: 999px; background: rgba(245, 158, 11, 0.18); color: #fcd34d;
    }
    .price { font-size: 17px; font-weight: 700; color: #34d399; }
    .price.free { color: #93c5fd; }
    .notice-tag { font-size: 14px; font-weight: 700; color: #a5b4fc; }
    .title { font-size: 16px; font-weight: 700; margin: 0; }
    .meta { font-size: 13px; color: var(--muted); white-space: pre-line; }
    .card-actions {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .qa-box {
      margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }
    .qa-head { font-size: 13px; font-weight: 700; color: #cbd5e1; }
    .qa-list {
      display: flex; flex-direction: column; gap: 6px;
      max-height: 260px; overflow-y: auto; padding-right: 2px;
    }
    .qa-thread { display: flex; flex-direction: column; gap: 4px; }
    .qa-item {
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px;
      padding: 7px 10px; font-size: 13px;
    }
    .qa-item.reply {
      border-left: 2px solid var(--primary);
      background: rgba(26, 36, 61, 0.72);
    }
    .qa-top {
      display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 2px;
    }
    .qa-author { font-weight: 600; color: #e2e8f0; font-size: 12px; }
    .qa-arrow { color: #93c5fd; font-weight: 600; }
    .qa-mini-actions { display: flex; align-items: center; gap: 6px; }
    .qa-link {
      background: none; border: none; color: #93c5fd; padding: 0 3px;
      font-size: 11px; font-weight: 600;
    }
    .qa-del {
      background: none; border: none; color: #fca5a5; padding: 0 3px;
      font-size: 11px; font-weight: 600;
    }
    .qa-target-bar {
      display: none; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 12px; color: #93c5fd; background: rgba(99, 102, 241, 0.14);
      border: 1px solid rgba(99, 102, 241, 0.35); border-radius: 8px; padding: 5px 8px;
    }
    .qa-target-bar.show { display: flex; }
    .qa-form { display: flex; gap: 6px; }
    .qa-form input { flex: 1; padding: 7px 10px; font-size: 13px; min-width: 0; }
    .qa-form button { padding: 7px 11px; font-size: 13px; white-space: nowrap; }
    .empty {
      text-align: center; padding: 42px 16px; color: var(--muted);
      background: var(--panel); border: 1px dashed var(--border); border-radius: 14px;
    }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(2, 6, 23, 0.78);
      display: none; align-items: center; justify-content: center; padding: 14px; z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto;
      background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .modal-head h2 { margin: 0; font-size: 18px; }
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .field label { font-size: 13px; color: #cbd5e1; font-weight: 600; }
    .err-box {
      display: none; margin-bottom: 12px; padding: 10px 12px; border-radius: 10px;
      background: rgba(239, 68, 68, 0.16); border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fecaca; font-size: 13px;
    }
    .err-box.show { display: block; }
    .link-btn {
      background: none; border: none; color: #93c5fd; text-decoration: underline;
      padding: 0; font-weight: 500;
    }
    .forgot-box {
      display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
    }
    .forgot-box.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <img class="brand-logo" src="./logo-phuoc-vinh.jpg" alt="Logo Trường THPT Phước Vĩnh" />
        <span>Trao Tay</span>
      </div>
      <div class="nav-actions" id="navActions">
        <button type="button" id="btnOpenLogin" class="btn-ghost">Đăng nhập</button>
        <button type="button" id="btnOpenRegister" class="btn-primary">Đăng ký</button>
      </div>
    </header>

    <section class="hero">
      <h1>Mua bán, cho tặng và trao đổi đồ cũ.</h1>
      <p>Đăng món đồ bạn muốn bán, cho đi</p>
    </section>

    <div class="toolbar">
      <input id="searchInput" type="search" placeholder="Tìm theo tên vật phẩm, thông báo, người đăng, địa chỉ..." />
      <select id="filterStatus">
        <option value="all">Tất cả bài đăng</option>
        <option value="notice">📢 Thông báo</option>
        <option value="gift">🎁 Quà tặng</option>
        <option value="sale">🛒 Mua bán</option>
        <option value="sold">Đã bán</option>
      </select>
    </div>

    <section id="staffPanel" class="staff-panel">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px;">
        <strong>🛡️ Quản lý thành viên & quyền Phó Admin</strong>
        <button type="button" id="btnRefreshUsers" class="btn-ghost" style="padding:6px 10px; font-size:13px;">Tải lại</button>
      </div>
      <div id="usersRoleList" style="display:grid; gap:8px;"></div>
    </section>

    <main id="itemsList" class="grid"></main>
  </div>

  <!-- Modal Đăng nhập / Đăng ký / Quên mật khẩu -->
  <div id="authModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal">
      <div class="modal-head">
        <h2 id="authTitle">Đăng nhập</h2>
        <button type="button" id="btnCloseAuth" class="btn-ghost">✕</button>
      </div>

      <div id="authErr" class="err-box"></div>

      <form id="authForm">
        <div id="registerFields" style="display:none;">
          <div class="field">
            <label for="regName">Tên hiển thị</label>
            <input id="regName" type="text" placeholder="Ví dụ: Nguyễn Văn A" />
          </div>
          <div class="field">
            <label for="regPhone">Số điện thoại</label>
            <input id="regPhone" type="tel" placeholder="Ví dụ: 0912345678" />
          </div>
        </div>

        <div class="field">
          <label for="authEmail">Email (Gmail)</label>
          <input id="authEmail" type="email" required placeholder="name@gmail.com" />
        </div>

        <div class="field">
          <label for="authPass">Mật khẩu (tối thiểu 8 ký tự)</label>
          <input id="authPass" type="password" required minlength="8" placeholder="Ví dụ: nguyenvana@1234" />
        </div>

        <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:6px;">
          <button type="button" id="btnCancelAuth" class="btn-ghost">Hủy</button>
          <button type="submit" id="btnSubmitAuth" class="btn-primary">Đăng nhập</button>
        </div>
      </form>

      <div style="margin-top:12px; display:flex; justify-content:space-between; align-items:center; font-size:13px;">
        <span id="toggleAuthText" style="color:var(--muted);">
          Chưa có tài khoản? <button type="button" id="btnSwitchModeInner" class="link-btn">Đăng ký</button>
        </span>
        <button type="button" id="btnOpenForgot" class="link-btn">Quên mật khẩu?</button>
      </div>

      <div id="forgotBox" class="forgot-box">
        <div class="field" style="margin-bottom:8px;">
          <label for="fpEmail">Khôi phục mật khẩu</label>
          <input id="fpEmail" type="email" placeholder="Nhập Gmail đã đăng ký..." />
        </div>
        <button type="button" id="btnSendReset" class="btn-primary" style="width:100%;">Gửi link đặt lại mật khẩu</button>
      </div>
    </div>
  </div>

  <!-- Modal Đăng tin 6 trường -->
  <div id="postModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal">
      <div class="modal-head">
        <h2>Đăng tin Trao Tay</h2>
        <button type="button" id="btnClosePost" class="btn-ghost">✕</button>
      </div>

      <div id="postErr" class="err-box"></div>

      <form id="postForm">
        <div class="field">
          <label for="pSellerName">Tên người bán</label>
          <input id="pSellerName" type="text" required placeholder="Nhập tên người bán" />
        </div>
        <div class="field">
          <label for="pTitle">Tên vật phẩm</label>
          <input id="pTitle" type="text" required placeholder="Ví dụ: Nhập tên món đồ" />
        </div>
        <div class="field">
          <label for="pCondition">Tình trạng vật phẩm</label>
          <input id="pCondition" type="text" required placeholder="Ví dụ: Mới 95%, cũ, còn dùng tốt..." />
        </div>
        <div class="field">
          <label for="pAddress">Địa chỉ</label>
          <input id="pAddress" type="text" required placeholder="Ví dụ: TP.HCM, Xã A, Ấp B, Tổ C,..." />
        </div>
        <div class="field">
          <label for="pPhone">Số điện thoại</label>
          <input id="pPhone" type="tel" required placeholder="Ví dụ: 0912345678" />
        </div>
        <div class="field">
          <label for="pPrice">Giá bán (nhập 0 VNĐ nếu tặng)</label>
          <input id="pPrice" type="number" min="0" step="1000" value="0" required />
        </div>
        <div class="field">
          <label for="pImage">Ảnh món đồ</label>
          <input id="pImage" type="file" accept="image/*" />
        </div>

        <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
          <button type="button" id="btnCancelPost" class="btn-ghost">Hủy</button>
          <button type="submit" id="btnSubmitPost" class="btn-primary">Đăng tin</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Đăng thông báo (Admin / Phó Admin) -->
  <div id="noticeModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal">
      <div class="modal-head">
        <h2>📢 Đăng thông báo</h2>
        <button type="button" id="btnCloseNotice" class="btn-ghost">✕</button>
      </div>

      <div id="noticeErr" class="err-box"></div>

      <form id="noticeForm">
        <div class="field">
          <label for="nAuthor">Người đăng</label>
          <input id="nAuthor" type="text" required placeholder="Ví dụ: Ban quản trị" />
        </div>
        <div class="field">
          <label for="nTitle">Tiêu đề thông báo</label>
          <input id="nTitle" type="text" required placeholder="Ví dụ: Quy định đăng tin & giao dịch" />
        </div>
        <div class="field">
          <label for="nContent">Nội dung thông báo</label>
          <textarea id="nContent" rows="4" required placeholder="Nhập nội dung thông báo chi tiết..."></textarea>
        </div>
        <div class="field">
          <label for="nImage">Ảnh đính kèm</label>
          <input id="nImage" type="file" accept="image/*" />
        </div>

        <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
          <button type="button" id="btnCancelNotice" class="btn-ghost">Hủy</button>
          <button type="submit" id="btnSubmitNotice" class="btn-primary">Đăng thông báo</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://enazqmppsnazycsrvutd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_QjN1z2ZHccsBbrgnWINklg_nca4uWGU";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let currentProfile = null;
    let isRegisterMode = false;
    let allItems = [];
    let commentsByItem = {};
    let activeReplyTarget = {};

    const navActions = document.getElementById("navActions");
    const itemsList = document.getElementById("itemsList");
    const searchInput = document.getElementById("searchInput");
    const filterStatus = document.getElementById("filterStatus");
    const staffPanel = document.getElementById("staffPanel");
    const usersRoleList = document.getElementById("usersRoleList");

    const authModal = document.getElementById("authModal");
    const authTitle = document.getElementById("authTitle");
    const authErr = document.getElementById("authErr");
    const authForm = document.getElementById("authForm");
    const registerFields = document.getElementById("registerFields");
    const btnSubmitAuth = document.getElementById("btnSubmitAuth");
    const toggleAuthText = document.getElementById("toggleAuthText");
    const btnOpenForgot = document.getElementById("btnOpenForgot");
    const forgotBox = document.getElementById("forgotBox");
    const fpEmail = document.getElementById("fpEmail");
    const btnSendReset = document.getElementById("btnSendReset");

    const postModal = document.getElementById("postModal");
    const postErr = document.getElementById("postErr");
    const postForm = document.getElementById("postForm");
    const btnSubmitPost = document.getElementById("btnSubmitPost");

    const noticeModal = document.getElementById("noticeModal");
    const noticeErr = document.getElementById("noticeErr");
    const noticeForm = document.getElementById("noticeForm");
    const btnSubmitNotice = document.getElementById("btnSubmitNotice");

    function escapeHtml(str = "") {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function escapeJsAttr(str = "") {
      return escapeHtml(str).replaceAll("'", "&#39;");
    }

    function formatPrice(val) {
      const n = Number(val || 0);
      if (n <= 0) return { text: "Tặng miễn phí (0 đ)", free: true };
      return { text: n.toLocaleString("vi-VN") + " đ", free: false };
    }

    function isMainAdmin(profile) {
      return profile?.role === "admin" || profile?.["vai trò"] === "quản trị viên";
    }

    function isSubAdmin(profile) {
      return profile?.role === "sub_admin" || profile?.["vai trò"] === "phó quản trị viên";
    }

    function isStaff(profile) {
      return isMainAdmin(profile) || isSubAdmin(profile);
    }

    function getRoleBadge(profile) {
      if (isMainAdmin(profile)) return "Admin";
      if (isSubAdmin(profile)) return "Phó Admin";
      return "";
    }

    function getCurrentDisplayName() {
      return currentProfile?.name || currentProfile?.["tên"] || currentUser?.email || "Thành viên";
    }

    function showBox(el, msg) {
      el.textContent = msg;
      el.classList.add("show");
    }

    function hideBox(el) {
      el.textContent = "";
      el.classList.remove("show");
    }

    function bindSwitchAuthButton() {
      const btn = document.getElementById("btnSwitchModeInner");
      if (btn) btn.onclick = () => openAuthModal(!isRegisterMode);
    }

    function openAuthModal(register = false) {
      isRegisterMode = register;
      hideBox(authErr);
      forgotBox.classList.remove("show");
      registerFields.style.display = register ? "block" : "none";
      authTitle.textContent = register ? "Đăng ký tài khoản" : "Đăng nhập";
      btnSubmitAuth.textContent = register ? "Đăng ký" : "Đăng nhập";
      toggleAuthText.innerHTML = register
        ? 'Đã có tài khoản? <button type="button" id="btnSwitchModeInner" class="link-btn">Đăng nhập</button>'
        : 'Chưa có tài khoản? <button type="button" id="btnSwitchModeInner" class="link-btn">Đăng ký</button>';
      bindSwitchAuthButton();
      authModal.classList.add("open");
    }

    function closeAuthModal() {
      authModal.classList.remove("open");
    }

    function openPostModal() {
      if (!currentUser) return openAuthModal(false);
      hideBox(postErr);
      postForm.reset();
      document.getElementById("pPrice").value = "0";
      if (currentProfile) {
        document.getElementById("pSellerName").value = currentProfile.name || currentProfile["tên"] || "";
        document.getElementById("pPhone").value = currentProfile.phone || currentProfile["điện thoại"] || "";
      }
      postModal.classList.add("open");
    }

    function closePostModal() {
      postModal.classList.remove("open");
    }

    function openNoticeModal() {
      if (!currentUser) return openAuthModal(false);
      if (!isStaff(currentProfile)) return alert("Chỉ Admin hoặc Phó Admin mới được đăng thông báo.");
      hideBox(noticeErr);
      noticeForm.reset();
      document.getElementById("nAuthor").value = getCurrentDisplayName();
      noticeModal.classList.add("open");
    }

    function closeNoticeModal() {
      noticeModal.classList.remove("open");
    }

    document.getElementById("btnCloseAuth").onclick = closeAuthModal;
    document.getElementById("btnCancelAuth").onclick = closeAuthModal;
    document.getElementById("btnClosePost").onclick = closePostModal;
    document.getElementById("btnCancelPost").onclick = closePostModal;
    document.getElementById("btnCloseNotice").onclick = closeNoticeModal;
    document.getElementById("btnCancelNotice").onclick = closeNoticeModal;
    bindSwitchAuthButton();

    btnOpenForgot.onclick = () => {
      forgotBox.classList.toggle("show");
      const currentEmail = document.getElementById("authEmail").value.trim();
      if (currentEmail && !fpEmail.value) fpEmail.value = currentEmail;
      fpEmail.focus();
    };

    btnSendReset.onclick = async () => {
      hideBox(authErr);
      const email = fpEmail.value.trim().toLowerCase();
      if (!email) return showBox(authErr, "Vui lòng nhập Gmail đã đăng ký để nhận link đặt lại mật khẩu.");
      btnSendReset.disabled = true;
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: "https://duyle19112011.github.io/Goodsbooks/"
      });
      btnSendReset.disabled = false;
      if (error) return showBox(authErr, "Lỗi gửi mail: " + error.message);
      alert("Đã gửi link đặt lại mật khẩu tới " + email + ". Hãy kiểm tra hộp thư (cả mục Spam).");

      e.preventDefault();

      const password = document.getElementById("authPass").value;

        const phone = document.getElementById("regPhone").value.trim();
        if (!displayName || !phone) {
          btnSubmitAuth.disabled = false;
          return showBox(authErr, "Vui lòng nhập đầy đủ Tên hiển thị và Số điện thoại.");
        }

      } else {

    function compressImageToJpg(file, maxWidth = 1080, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(
              (blob) => (blob ? resolve(blob) : reject(new Error("Không nén được ảnh"))),
              "image/jpeg",
              quality
            );
          };
          img.onerror = () => reject(new Error("File ảnh không hợp lệ"));
          img.src = reader.result;
        };
        reader.onerror = () => reject(new Error("Không đọc được file"));
        reader.readAsDataURL(file);
      });
    }

    async function uploadOptionalImage(file) {
      if (!file) return null;
      const jpgBlob = await compressImageToJpg(file);
      const filePath = `${currentUser.id}/${Date.now()}.jpg`;
      const { error: upErr } = await sb.storage
        .from("tt-images")
        .upload(filePath, jpgBlob, { contentType: "image/jpeg", upsert: true });
      if (upErr) throw new Error("Lỗi tải ảnh: " + upErr.message);
      return sb.storage.from("tt-images").getPublicUrl(filePath).data.publicUrl;
    }

      btnSubmitPost.disabled = true;

          title,

      try {

          user_id: currentUser.id,
          post_type: "notice",
          seller_name,
          title,
          condition,
          address: "Ban quản trị",
          phone: "Thông báo chung",
          price: 0,
          image_url,

    window.togglePin = async (id, nextPinned) => {
      if (!isStaff(currentProfile)) return alert("Chỉ Admin hoặc Phó Admin mới có quyền ghim bài.");
      const { error } = await sb.from("tt_items").update({ is_pinned: nextPinned }).eq("id", id);

    window.selectReplyTarget = (itemId, commentId, authorName) => {
      if (!currentUser) return openAuthModal(false);
      activeReplyTarget[itemId] = { id: commentId, author_name: authorName };
      renderItems();

    };

    window.submitReply = async (event, itemId, inputId) => {

      if (!currentUser) return openAuthModal(false);

      const input = document.getElementById(inputId);
      const content = (input?.value || "").trim();
      if (!content) return;

      const target = activeReplyTarget[itemId] || null;

      const { error } = await sb.from("tt_comments").insert({
        item_id: itemId,
        user_id: currentUser.id,
        author_name: getCurrentDisplayName(),
        content,
        parent_id: target ? target.id : null

      if (error) return alert("Lỗi gửi hỏi đáp: " + error.message);

      if (input) input.value = "";

    window.deleteUserAccount = async (targetId, userName) => {

    async function loadStaffPanel() {
      if (!currentUser || !isMainAdmin(currentProfile)) {

      usersRoleList.innerHTML = `<div class="meta">Đang tải danh sách thành viên...</div>`;

      const { data, error } = await sb.from("tt_profiles").select("*");
      if (error) {
        usersRoleList.innerHTML = `<div class="meta">Không đọc được danh sách hồ sơ: ${escapeHtml(error.message)}</div>`;

      }

          <div class="user-row">
            <div>
              <strong>${escapeHtml(uName)}</strong>

              <span class="status-pill" style="margin-left:6px;">${sub ? "Phó Admin" : "Người dùng"}</span>
            </div>
            <div style="display:flex; flex-wrap:wrap; gap:6px;">
              <button
                type="button"
                class="${sub ? "btn-danger" : "btn-success"}"
                style="padding:6px 10px; font-size:13px;"
                onclick="toggleSubAdmin('${u.id}', ${!sub})"
              >

              </button>
              <button
                type="button"
                class="btn-danger"
                style="padding:6px 10px; font-size:13px;"
                onclick="deleteUserAccount('${u.id}', '${safeName}')"

    document.getElementById("btnRefreshUsers").onclick = loadStaffPanel;

    function renderNav() {
      if (!currentUser) {
        navActions.innerHTML = `
          <button type="button" id="btnOpenLogin" class="btn-ghost">Đăng nhập</button>
          <button type="button" id="btnOpenRegister" class="btn-primary">Đăng ký</button>
        `;
        document.getElementById("btnOpenLogin").onclick = () => openAuthModal(false);
        document.getElementById("btnOpenRegister").onclick = () => openAuthModal(true);
        return;
      }
      const displayName = getCurrentDisplayName();
      const roleBadge = getRoleBadge(currentProfile);
      const staff = isStaff(currentProfile);

      navActions.innerHTML = `
        <span class="badge-user">${escapeHtml(displayName)}${roleBadge ? " • " + escapeHtml(roleBadge) : ""}</span>
        ${staff ? `<button type="button" id="btnOpenNotice" class="btn-amber">+ Đăng thông báo</button>` : ""}
        <button type="button" id="btnOpenPost" class="btn-primary">+ Đăng tin</button>
        <button type="button" id="btnLogout" class="btn-ghost">Đăng xuất</button>
      `;
      if (staff) document.getElementById("btnOpenNotice").onclick = openNoticeModal;
      document.getElementById("btnOpenPost").onclick = openPostModal;

    function renderSingleComment(c, item, staff, isReply = false, targetAuthorName = "", indentPx = 0) {
      const canDel = currentUser && (currentUser.id === c.user_id || currentUser.id === item.user_id || staff);
      const authorLabel = isReply && targetAuthorName
        ? `${escapeHtml(c.author_name)} <span class="qa-arrow">-></span> ${escapeHtml(targetAuthorName)}`
        : escapeHtml(c.author_name);
      const styleAttr = indentPx > 0 ? `style="margin-left:${indentPx}px;"` : "";

      return `
        <div class="qa-item ${isReply ? "reply" : ""}" ${styleAttr}>
          <div class="qa-top">
            <span class="qa-author">${authorLabel}</span>
            <span class="qa-mini-actions">
              <button type="button" class="qa-link" onclick="selectReplyTarget('${item.id}', '${c.id}', '${escapeJsAttr(c.author_name)}')">Trả lời</button>
              ${canDel ? `<button type="button" class="qa-del" onclick="deleteComment('${c.id}')">Xóa</button>` : ""}
            </span>
          </div>
          <div>${escapeHtml(c.content)}</div>
        </div>
      `;
    }

    function renderCommentsHtml(item) {
      const list = commentsByItem[item.id] || [];
      const staff = isStaff(currentProfile);
      const inputId = `replyInput_${item.id}`;
      const selectedTarget = activeReplyTarget[item.id] || null;

      const byId = {};
      for (const c of list) byId[c.id] = c;

      const getRootId = (c) => {
        let cur = c;
        const seen = new Set([cur.id]);
        while (cur.parent_id && byId[cur.parent_id] && !seen.has(cur.parent_id)) {
          cur = byId[cur.parent_id];
          seen.add(cur.id);
        }
        return cur.id;
      };

      const roots = list.filter((c) => !c.parent_id || !byId[c.parent_id]);
      const childrenByParent = {};
      const repliesByRoot = {};

      for (const c of list) {
        if (c.parent_id && byId[c.parent_id]) {
          if (!childrenByParent[c.parent_id]) childrenByParent[c.parent_id] = [];
          childrenByParent[c.parent_id].push(c);

          const rId = getRootId(c);
          if (!repliesByRoot[rId]) repliesByRoot[rId] = [];
          repliesByRoot[rId].push(c);
        }
      }

      const listHtml = roots.length
        ? roots.map((root) => {
            const visited = new Set([root.id]);
            const threadParts = [renderSingleComment(root, item, staff, false, "", 0)];

            const walkReplies = (parentId, depth) => {
              const directChildren = childrenByParent[parentId] || [];
              for (const child of directChildren) {
                if (visited.has(child.id)) continue;
                visited.add(child.id);
                const parentObj = byId[child.parent_id];
                const indent = Math.min(24, 12 + Math.max(0, depth - 1) * 6);
                threadParts.push(
                  renderSingleComment(child, item, staff, true, parentObj?.author_name || "", indent)
                );
                walkReplies(child.id, depth + 1);
              }
            };

            walkReplies(root.id, 1);

            for (const r of (repliesByRoot[root.id] || [])) {
              if (!visited.has(r.id)) {
                visited.add(r.id);
                const pObj = byId[r.parent_id];
                threadParts.push(renderSingleComment(r, item, staff, true, pObj?.author_name || "", 12));
              }
            }

            return `<div class="qa-thread">${threadParts.join("")}</div>`;
          }).join("")
        : `<div class="meta">Chưa có hỏi đáp nào.</div>`;

      const targetBarHtml = currentUser
        ? `
          <div class="qa-target-bar ${selectedTarget ? "show" : ""}">
            <span>Đang trả lời <strong>${escapeHtml(selectedTarget?.author_name || "")}</strong></span>
            <button type="button" class="qa-del" onclick="clearReplyTarget('${item.id}')">✕ Hủy</button>
          </div>
        `
        : "";

      const formHtml = currentUser
        ? `
          ${targetBarHtml}
          <form class="qa-form" onsubmit="submitReply(event, '${item.id}', '${inputId}')">
            <input
              id="${inputId}"
              type="text"
              required
              maxlength="300"
              placeholder="${selectedTarget ? `Trả lời ${escapeHtml(selectedTarget.author_name)}...` : "Hỏi hoặc bình luận..."}"
            />
            <button type="submit" class="btn-primary">Gửi</button>
          </form>
        `
        : `<button type="button" class="link-btn" style="text-align:left; font-size:12px;" onclick="openAuthModal(false)">Đăng nhập để hỏi đáp</button>`;

      return `
        <div class="qa-box">
          <div class="qa-head">💬 Hỏi đáp (${list.length})</div>
          <div class="qa-list">${listHtml}</div>
          ${formHtml}
        </div>
      `;
    }

    function renderItems() {
      const q = searchInput.value.trim().toLowerCase();
      const status = filterStatus.value;

      const sorted = [...allItems].sort((a, b) => {
        const pinDiff = Number(Boolean(b.is_pinned)) - Number(Boolean(a.is_pinned));
        if (pinDiff !== 0) return pinDiff;
        return new Date(b.created_at || 0) - new Date(a.created_at || 0);
      });

      const filtered = sorted.filter((it) => {
        const isNotice = it.post_type === "notice";
        const isFreeGift = !isNotice && Number(it.price || 0) <= 0;
        const isPaidSale = !isNotice && Number(it.price || 0) > 0;

        if (status === "notice" && !isNotice) return false;
        if (status === "gift" && (!isFreeGift || it.is_sold)) return false;
        if (status === "sale" && (!isPaidSale || it.is_sold)) return false;
        if (status === "sold" && (isNotice || !it.is_sold)) return false;

        if (!q) return true;
        const hay = `${it.title} ${it.seller_name} ${it.condition} ${it.address} ${it.phone}`.toLowerCase();
        return hay.includes(q);
      });

      if (!filtered.length) {
        itemsList.innerHTML = `<div class="empty">Chưa có bài đăng nào phù hợp.</div>`;
        return;
      }

      const staff = isStaff(currentProfile);

      itemsList.innerHTML = filtered.map((it) => {
        const isNotice = it.post_type === "notice";
        const isPinned = Boolean(it.is_pinned);
        const canManage = currentUser && (currentUser.id === it.user_id || staff);

        const badgesHtml = (isPinned || isNotice || (!isNotice && it.is_sold))
          ? `<div class="badges">
              ${isPinned ? `<span class="pill-pin">📌 Đã ghim</span>` : ""}
              ${isNotice ? `<span class="pill-notice">📢 Thông báo</span>` : ""}
              ${!isNotice && it.is_sold ? `<span class="status-pill">Đã bán / Đã giao</span>` : ""}
            </div>`
          : "";

        let bodyInfoHtml = "";
        if (isNotice) {
          bodyInfoHtml = `
            <div class="notice-tag">Thông báo từ Ban quản trị</div>
            <h3 class="title">${escapeHtml(it.title)}</h3>
            <div class="meta">${escapeHtml(it.condition)}</div>
            <div class="meta"><strong>Người đăng:</strong> ${escapeHtml(it.seller_name)}</div>
          `;
        } else {
          const p = formatPrice(it.price);
          bodyInfoHtml = `
            <div class="price ${p.free ? "free" : ""}">${escapeHtml(p.text)}</div>
            <h3 class="title">${escapeHtml(it.title)}</h3>
            <div class="meta"><strong>Tình trạng:</strong> ${escapeHtml(it.condition)}</div>
            <div class="meta"><strong>Người bán:</strong> ${escapeHtml(it.seller_name)}</div>
            <div class="meta"><strong>SĐT:</strong> ${escapeHtml(it.phone)}</div>
            <div class="meta"><strong>Địa chỉ:</strong> ${escapeHtml(it.address)}</div>
          `;
        }

        const actionsHtml = (canManage || staff)
          ? `<div class="card-actions">
              ${staff ? `
                <button type="button" class="btn-amber" onclick="togglePin('${it.id}', ${!isPinned})">
                  ${isPinned ? "Bỏ ghim" : "Ghim bài"}
                </button>
              ` : ""}
              ${!isNotice && canManage ? `
                <button type="button" class="btn-success" onclick="toggleSold('${it.id}', ${!it.is_sold})">
                  ${it.is_sold ? "Mở lại tin" : "Đánh dấu đã bán"}
                </button>
              ` : ""}
              ${canManage ? `
                <button type="button" class="btn-danger" onclick="deleteItem('${it.id}')">Xóa</button>
              ` : ""}
            </div>`
          : "";

        return `
          <article class="card ${isPinned ? "pinned" : ""} ${isNotice ? "notice" : ""} ${!isNotice && it.is_sold ? "sold" : ""}">
            ${it.image_url
              ? `<img class="thumb" src="${escapeHtml(it.image_url)}" alt="${escapeHtml(it.title)}" loading="lazy" />`
              : (!isNotice ? `<div class="thumb">Không có ảnh</div>` : "")
            }
            <div class="card-body">
              ${badgesHtml}
              ${bodyInfoHtml}
              ${actionsHtml}
              ${renderCommentsHtml(it)}
            </div>
          </article>
        `;
      }).join("");
    }

    async function loadProfile(user) {
      if (!user) {
        currentProfile = null;
        return;
      }
      const { data } = await sb.from("tt_profiles").select("*").eq("id", user.id).maybeSingle();
      currentProfile = data || null;
    }

    async function loadComments() {
      const { data, error } = await sb
        .from("tt_comments")
        .select("*")
        .order("created_at", { ascending: true });
      if (error) {
        commentsByItem = {};
        return;
      }
      const grouped = {};
      for (const row of data || []) {
        if (!grouped[row.item_id]) grouped[row.item_id] = [];
        grouped[row.item_id].push(row);
      }
      commentsByItem = grouped;
      renderItems();
    }

    async function loadItems() {
      const { data, error } = await sb
        .from("tt_items")
        .select("*")
        .order("created_at", { ascending: false });
      if (error) {
        itemsList.innerHTML = `<div class="empty">Không tải được danh sách bài: ${escapeHtml(error.message)}</div>`;
        return;
      }
      allItems = data || [];
      renderItems();
      await loadComments();
    }

    searchInput.oninput = renderItems;
    filterStatus.onchange = renderItems;

    sb.auth.onAuthStateChange(async (event, session) => {
      currentUser = session?.user || null;
      await loadProfile(currentUser);
      renderNav();
      await loadStaffPanel();
      renderItems();

      if (event === "PASSWORD_RECOVERY") {
        const newPass = prompt("Nhập mật khẩu mới (tối thiểu 8 ký tự):");
        if (!newPass || newPass.length < 8) {
          alert("Mật khẩu mới cần ít nhất 8 ký tự.");
          return;
        }
        const { error } = await sb.auth.updateUser({ password: newPass });
        alert(error ? "Đổi mật khẩu lỗi: " + error.message : "Đổi mật khẩu thành công!");
      }
    });

    (async function init() {
      const { data: { session } } = await sb.auth.getSession();
      currentUser = session?.user || null;
      await loadProfile(currentUser);
      renderNav();
      await loadStaffPanel();
      await loadItems();
    })();
  </script>
